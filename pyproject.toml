[project]
name = "subtask-mcp"
dynamic = ["version"]
description = "Background sub-agents for Claude Code, Codex, Kimi and OpenCode, over MCP or CLI, with a spend cap"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["claude-agent-sdk>=0.2", "mcp>=1.28,<2"]

[project.optional-dependencies]
dsh = ["deepseek-harness-sdk==0.1.5rc1"]

[project.scripts]
subtask = "subtask.cli:run"
subtask-mcp = "subtask.fastserver:main"
subtask-mcp-fastmcp = "subtask.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subtask"]

[tool.setuptools.dynamic]
version = { attr = "subtask.__version__" }

[tool.setuptools.package-data]
subtask = ["tools.json"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"subtask/worker.py" = ["BLE001"]
