name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: subtask version (`subtask --version` or subtask/__init__.py)
  - type: input
    id: env
    attributes:
      label: OS, Python version, engine and engine version
  - type: textarea
    id: logs
    attributes:
      label: Logs (remove secrets first)
      render: text
