name: contract

# Weekly, offline only: adapter contract tests run on recorded engine output.
# Live engine checks need real CLIs, secrets and budget, so they are manual and not run here.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: "Also run live engine checks (needs repository secrets; skipped when absent)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: |
          uv venv
          uv pip install -e '.[dev]' -c constraints.txt
      - run: uv run --no-sync pytest -q -p no:cacheprovider -m contract

  live:
    # Manual only: real jobs cost money. Runs tests/test_live.py on the API engine
    # (each job capped at 0.20 USD). Needs the repository secret ANTHROPIC_API_KEY;
    # CLI engines (codex, kimi, opencode-go) need their own logins and run locally.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when no secret
        if: env.KEY == ''
        run: echo "No ANTHROPIC_API_KEY secret set; live checks skipped."
      - uses: actions/checkout@v7
        if: env.KEY != ''
      - uses: astral-sh/setup-uv@v7
        if: env.KEY != ''
        with:
          python-version: "3.13"
      - name: Live adapter checks (haiku-api)
        if: env.KEY != ''
        run: |
          mkdir -p ~/.config/subtask
          umask 077 && printf 'ANTHROPIC_API_KEY=%s\n' "$KEY" > ~/.config/subtask/env
          uv venv && uv pip install -e '.[dev]' -c constraints.txt
          uv run --no-sync pytest -q -p no:cacheprovider -m live -k haiku tests/test_live.py -rs
